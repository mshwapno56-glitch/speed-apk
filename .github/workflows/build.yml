name: Build COAK.net APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # If you uploaded coak-source.zip, unpack it; otherwise use the repo files directly.
      - name: Prepare source
        run: |
          mkdir -p build_src
          if [ -f coak-source.zip ]; then
            unzip -q -o coak-source.zip -d build_src
          else
            rsync -a --exclude build_src --exclude .git ./ build_src/
          fi
          ls -la build_src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: build_src
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp build_src/app/build/outputs/apk/debug/app-debug.apk out/COAK-net.apk

      - uses: actions/upload-artifact@v4
        with:
          name: COAK-net-apk
          path: out/COAK-net.apk
